<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Raíz — Tostado Artesanal</title>
  <meta name="description" content="Café Raíz: café tostado artesanalmente con granos de origen único.">
  <link rel="stylesheet" href="./estilos.css">
  <link rel="icon" href="./img/favicon.ico">
</head>

<body>

  <!-- BARRA DE NAVEGACIÓN (HEADER) -->
  <header class="navbar">
    <div class="navbar-contenedor">
      <a href="#" class="navbar-marca">
        <div class="navbar-textos">
          <span class="navbar-titulo">Café Raíz</span>
          <span class="navbar-subtitulo">Tostado Artesanal</span>
        </div>
      </a>

      <nav class="navbar-menu" aria-label="Navegación principal">
        <a href="#inicio" class="nav-enlace activo">Inicio</a>
        <a href="#promocion" class="nav-enlace">Promoción</a>
        <a href="#productos" class="nav-enlace">Productos</a>
        <a href="#origen" class="nav-enlace">Origen</a>
        <a href="#testimonios" class="nav-enlace">Testimonios</a>
      </nav>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL (Aquí integras tus 4 componentes) -->
  <main class="contenedor-principal">

    <!-- El web component muestra una promoción configurable mediante
         los atributos descuento/codigo y los slots de iamgen, título, texto y acción. -->
    <banner-promocion descuento="20" codigo="CAFERAIZ2026" class="noise">
         <img slot="imagen" src="./img/coffee-bag.png" width="80%">
         <span slot="titulo">DESCUENTO EN TU PRIMER PEDIDO</span>
         <span>Granos molidos en tu puerta.</span>
         <span slot="accion">Explorar Granos</span>
    </banner-promocion>

  </main>

  <!-- PIE DE PÁGINA (FOOTER) -->
  <footer class="footer">
    <div class="footer-contenedor">
      <div class="footer-marca">
        <p class="footer-nombre">Café Raíz</p>
        <p class="footer-eslogan">Granos de origen único · Tostado artesanal</p>
      </div>

      <p class="footer-copy">
        © 2026 Café Raíz · Proyecto de Componentes Web
      </p>

      <div class="footer-redes">
        <a href="#" aria-label="Instagram" class="red-enlace">Instagram</a>
        <a href="#" aria-label="Facebook" class="red-enlace">Facebook</a>
        <a href="#" aria-label="Contacto" class="red-enlace">Contacto</a>
      </div>
    </div>
  </footer>

  <!-- MÓDULOS DE COMPONENTES WEB -->
  <script type="module" src="./app.js"></script>

</body>

</html>
